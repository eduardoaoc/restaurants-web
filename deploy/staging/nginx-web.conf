# AFORO web (SPA) — STAGING. nginx server block serving the static build of
# `npm run build:staging` (dist/). Replace CHANGE_ME_WEB_HOST; the API host
# below must match VITE_API_URL / VITE_REVERB_HOST of the build.
# Runbook: restaurants-api/docs/staging-runbook.md §3.5.
#
# Layout: /srv/aforo-staging/web/{releases/<id>,current -> releases/<id>}
# Each release is a copy of dist/; switch with an atomic symlink, no reload.

server {
    listen 80;
    listen [::]:80;
    server_name CHANGE_ME_WEB_HOST;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name CHANGE_ME_WEB_HOST;

    ssl_certificate     /etc/letsencrypt/live/CHANGE_ME_WEB_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CHANGE_ME_WEB_HOST/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /srv/aforo-staging/web/current;
    index index.html;
    server_tokens off;

    access_log /var/log/nginx/aforo-web-staging.access.log;
    error_log  /var/log/nginx/aforo-web-staging.error.log warn;

    # Security headers (also on the SPA fallback). CSP notes:
    # - script-src: the bundle + the inline theme bootstrap of index.html by
    #   hash. If index.html's inline <script> changes, recompute the hash
    #   (runbook §3.5) or the theme flash-guard is blocked (app still works).
    # - connect-src: API (XHR) + Reverb (wss) on the API host.
    # - img-src: product media served by the API (/storage), QR codes
    #   (data:), local previews (blob:).
    # - style-src 'unsafe-inline': Vue style bindings/attributes.
    set $aforo_csp "default-src 'self'; script-src 'self' 'sha256-Sc4ToTCRuwfZJwF9El9yQ42YZVtRxI2kQAFOKNeKFM4='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api-staging.conejocreative.com; media-src 'self' blob: https://api-staging.conejocreative.com; font-src 'self'; connect-src 'self' https://api-staging.conejocreative.com wss://api-staging.conejocreative.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
    add_header Content-Security-Policy $aforo_csp always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Hashed build assets: cache forever (new names on every build).
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Never serve dotfiles or source maps (the build emits none; defence in depth).
    location ~ /\. { deny all; return 404; }
    location ~* \.map$ { deny all; return 404; }

    # History-mode router: every app route (/login, /invitation, /t/:token,
    # /app/...) falls back to index.html, which is never cached so a deploy
    # is picked up immediately.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy $aforo_csp always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }
}
